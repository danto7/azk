{{define "content"}}
<h1>Audit log</h1>
{{if .Data}}
<table id="audit">
  <thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Target</th><th>Details</th></tr></thead>
  <tbody>
  {{range .Data}}<tr><td class="muted">{{time .At}}</td><td>{{.Actor}}</td><td>{{.Action}}</td><td>{{.Target}}</td><td><code class="small">{{.Details}}</code></td></tr>{{end}}
  </tbody>
</table>
{{else}}<p class="muted">No entries.</p>{{end}}
{{end}}
